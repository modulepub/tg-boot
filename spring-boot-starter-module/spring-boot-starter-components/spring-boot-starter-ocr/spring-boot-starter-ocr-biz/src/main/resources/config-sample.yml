## >>>>>>FILE模块上传配置 BEGIN
upload:
  urlPrefix: https://file.example.com/matchmaker
  # 文件上传方式，可选项：local（本地）、minio（minio）
  type: minio
  local:
    path: /opt/upFiles
    # minio文件上传
  minio:
    minioUrl: http://127.0.0.1:9000
    minioName: minioadmin
    minioPass: minioadmin
    bucketName: matchmaker
  oss:
    accessKey: YOUR_ALIYUN_ACCESS_KEY_ID
    secretKey: your-oss-secret-key-here
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucketName: example-bucket
## <<<<<<FILE模块上传配置 END
